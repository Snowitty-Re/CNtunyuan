# 本地开发依赖：仅 Postgres + Redis
# 本机勿安装 postgres/redis，统一用容器。
# 用法：
#   docker compose up -d
#   docker compose ps
#   docker compose down
#
# 后端 / Web 仍在本机运行，连接映射端口：
#   database.host: localhost  port: 5432
#   redis.host: localhost     port: 6379

services:
  postgres:
    image: postgres:16-alpine
    container_name: cnty-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cntuanyuan
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - cnty_pg_data:/var/lib/postgresql/data
      # 仅在空数据卷首次启动时执行；已有数据不会重复跑
      - ./backend/migrations/postgres/00_bootstrap.sql:/docker-entrypoint-initdb.d/00_bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cntuanyuan"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cnty-redis
    ports:
      - "6379:6379"
    volumes:
      - cnty_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  cnty_pg_data:
  cnty_redis_data:
