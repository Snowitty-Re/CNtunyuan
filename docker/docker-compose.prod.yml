# 团圆寻亲系统 - 生产环境部署配置
version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: cntuanyuan-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-cntuanyuan}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cntuanyuan-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: cntuanyuan-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cntuanyuan-network

  # 后端 API 服务
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cntuanyuan-backend
    restart: always
    environment:
      # 数据库配置
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DB_USER:-postgres}
      DATABASE_PASSWORD: ${DB_PASSWORD:-changeme}
      DATABASE_NAME: ${DB_NAME:-cntuanyuan}
      DATABASE_SSL_MODE: disable
      
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
      
      # JWT 配置（必须从环境变量读取）
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_TIME: 604800
      
      # 服务器配置
      SERVER_PORT: 8080
      SERVER_MODE: release
      
      # 微信配置
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_ENABLE_LOGIN: ${WECHAT_ENABLE_LOGIN:-true}
      
      # 存储配置
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_PATH: /app/uploads
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:-http://localhost:8080/uploads}
      
      # 日志配置
      LOG_LEVEL: info
      LOG_FORMAT: json
      
      # 系统配置
      SYSTEM_ENABLE_REGISTER: ${ENABLE_REGISTER:-true}
      SYSTEM_ENABLE_WECHAT_LOGIN: ${ENABLE_WECHAT_LOGIN:-true}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/main", "-check-db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cntuanyuan-network

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: cntuanyuan-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      - backend
    networks:
      - cntuanyuan-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  cntuanyuan-network:
    driver: bridge
