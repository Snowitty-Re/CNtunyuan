host: localhost:8080
info:
  contact:
    email: support@cntunyuan.org
    name: CNtunyuan Team
    url: https://github.com/Snowitty-Re/CNtunyuan
  description: 助力团圆志愿者系统后端 API 文档
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://github.com/Snowitty-Re/CNtunyuan
  title: 助力团圆志愿者系统 API
  version: 1.0.0
paths:
  /:
    get:
      description: 获取系统基础信息与文档入口
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Snowitty-Re_CNtunyuan_pkg_response.Response'
      summary: 欢迎信息
      tags:
      - 健康检查
  /audit/cleanup:
    post:
      consumes:
      - application/json
      description: 清理指定天数之前的审计日志，只有超级管理员可以执行此操作
      parameters:
      - description: 清理请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_interfaces_http_handler.CleanupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Snowitty-Re_CNtunyuan_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_interfaces_http_handler.CleanupResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/github_com_Snowitty-Re_CNtunyuan_pkg_response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/github_com_Snowitty-Re_CNtunyuan_pkg_response.Response'
        "403":
          description: 禁止访问，需要超级管理员权限
          schema:
            $ref: '#/definitions/github_com_Snowitty-Re_CNtunyuan_pkg_response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/github_com_Snowitty-Re_CNtunyuan_pkg_response.Response'
      security:
      - ApiKeyAuth: []
      summary: 清理旧日志
      tags:
      - 审计日志
  /audit/logs:
    get:
      consumes:
      - application/json
      description: 分页查询审计日志列表，支持按用户、模块、操作类型、状态、时间范围等条件筛选
      parameters:
      - default: 1
        description: 页码，默认1
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: 每页数量，默认20
        in: query
        maximum: 100
        minimum: 1
